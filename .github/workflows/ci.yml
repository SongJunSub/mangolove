name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install BATS
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y bats
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install bats-core
          fi

      - name: Run tests
        run: bats tests/

  plugin-validate:
    name: Plugin manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # tests/methodology-split.bats 의 validate 케이스는 claude 가 없으면 skip 된다.
      # CI 에서 실제로 돌게 하려면 CLI 를 설치해야 한다. 설치 실패는 경고로 두고
      # (레지스트리 장애로 전체 CI 를 막지 않는다), 설치됐는데 검증이 실패하면 잡는다.
      - name: Install Claude Code
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate cc-plugin manifest, skills and agents
        run: |
          if ! command -v claude > /dev/null 2>&1; then
            echo "::warning::claude CLI unavailable - skipping plugin validation"
            exit 0
          fi
          claude plugin validate --strict cc-plugin

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck -x bin/mangolove
          shellcheck -x lib/*.sh
          shellcheck -x install.sh
          shellcheck -x uninstall.sh
